<style>
:root{--bg:#fdeef5;--surface:#fffafc;--ink:#3b1430;--muted:#8c5878;--line:#f2cfe0;--accent:#d6336c;--on:#fff;--bad:#d6283c}
@media (prefers-color-scheme:dark){:root{--bg:#1d1018;--surface:#271620;--ink:#fbe6f0;--muted:#c79ab4;--line:#4a2a3c;--accent:#ff6fa5;--on:#2a0d1c;--bad:#ff6b7d}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif}
iframe{border:0;width:100%;height:100%;display:block}
.box{max-width:420px;margin:12vh auto 0;padding:0 16px;display:grid;gap:12px}
h1{margin:0;color:var(--accent);font-size:1.6rem}
p{margin:0;color:var(--muted)}
input{font:inherit;font-size:1rem;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
button{font:inherit;font-weight:600;padding:10px 14px;border:0;border-radius:10px;background:var(--accent);color:var(--on);cursor:pointer;min-height:44px}
.err{color:var(--bad)}
</style></head>
<body>
<div class="box" id="box"><h1>Q2 Planner</h1><p id="msg">Loading…</p></div>
<script>
/* Public shell, no schedule inside. Your schedule and the app itself live in the private repo
   srylstu2007/q2-planner; this page fetches them with the token saved on this device. */
const UI_API = "https://api.github.com/repos/srylstu2007/q2-planner/contents/app/index.html?ref=main";
const get = k => { try { return localStorage.getItem(k) } catch (e) { return null } };
const put = (k, v) => { try { localStorage.setItem(k, v) } catch (e) {} };
const token = () => { try { return JSON.parse(get('q2sched-token') || '""') } catch (e) { return '' } };
const num = h => +((h || '').match(/q2planner-ui" content="(\d+)"/) || [0, 0])[1];
const $ = id => document.getElementById(id);
let frame = null, current = '';
function show(h) {
  current = h;
  if (!frame) { frame = document.createElement('iframe'); $('box').remove(); document.body.appendChild(frame) }
  frame.srcdoc = h;
}
async function fetchUi(t) {
  const r = await fetch(UI_API + '&t=' + Date.now(), { cache: 'no-store', headers: { Authorization: 'Bearer ' + t, Accept: 'application/vnd.github.raw+json' } });
  if (!r.ok) throw { status: r.status };
  return r.text();
}
async function check() {
  const t = token(); if (!t) return;
  try {
    const h = await fetchUi(t);
    if (num(h) > num(current)) {
      put('q2-ui', h);
      const busy = frame && [...frame.contentDocument.querySelectorAll('dialog')].some(d => d.open);
      if (!busy) show(h);
    }
  } catch (e) {
    if (!frame && e.status === 401) askToken('GitHub didn’t accept the saved token (expired?). Paste a new one.');
  }
}
function askToken(why) {
  $('box').innerHTML = `<h1>Q2 Planner</h1><p>${why || 'Paste your GitHub token to open your schedule. It is saved on this device only.'}</p>
    <form id="f"><input id="tok" type="password" placeholder="github_pat_…" autocomplete="off" style="width:100%;box-sizing:border-box"></form>
    <button id="go">Open</button><p id="e" class="err" hidden></p>`;
  const go = async ev => {
    ev && ev.preventDefault();
    const t = $('tok').value.trim(); if (!t) return;
    $('go').disabled = true; $('e').hidden = true;
    try { const h = await fetchUi(t); put('q2sched-token', JSON.stringify(t)); put('q2-ui', h); show(h) }
    catch (e) { $('e').textContent = e.status === 401 ? 'GitHub didn’t accept that token.' : e.status === 404 ? 'That token can’t see the q2-planner repo.' : 'Couldn’t reach GitHub. Check your internet.'; $('e').hidden = false; $('go').disabled = false }
  };
  $('go').onclick = go; $('f').onsubmit = go;
}
const cached = get('q2-ui');
if (cached) show(cached);
if (!token()) { if (!cached) askToken() }
else check().then(() => { if (!frame) $('msg').textContent = 'Couldn’t load. Check your internet and reopen.' });
setInterval(check, 5 * 60 * 1000);
// also look for a new app version whenever you come back to the window (at most once a minute)
let lastFocus = Date.now();
const onBack = () => { if (document.visibilityState === 'visible' && Date.now() - lastFocus > 60000) { lastFocus = Date.now(); check() } };
window.addEventListener('focus', onBack); document.addEventListener('visibilitychange', onBack);
// the app's ↻ button asks the shell to look for a new app version right away
window.addEventListener('message', e => { if (e.source === (frame && frame.contentWindow) && e.data && e.data.q2 === 'check-ui') check() });
</script>
</body></html>
